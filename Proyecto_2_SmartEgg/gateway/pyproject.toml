[project]
name = "smartegg-gateway"
version = "0.1.0"
description = "Puente USB ↔ MQTT entre la ESP32 y el broker de SmartEgg"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "DTZ"]
# El ciclo serial debe atrapar cualquier error del driver para reconectar.
ignore = ["BLE001"]
