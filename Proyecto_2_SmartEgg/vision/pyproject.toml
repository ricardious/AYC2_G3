[project]
name = "smartegg-vision"
version = "0.1.0"
description = "Servicio de visión de SmartEgg: clasifica las fotos de la bandeja"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "paho-mqtt>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "DTZ"]
